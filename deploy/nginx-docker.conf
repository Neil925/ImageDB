# ImageDB nginx (runs as the `web` container in docker-compose.yml)
# Serves /media/ straight from the shared volume, proxies the app, and
# enforces basic auth in front of everything (private board).
#
# htpasswd file:  printf 'neil:%s\n' "$(openssl passwd -6 'secret')" > deploy/htpasswd
# TLS: drop certs in deploy/certs/<domain>/ and uncomment the 443 block.

server {
    listen 80;
    server_name _;

    # uploads + thumbnail generation headroom
    client_max_body_size 40m;

    auth_basic "ImageDB";
    auth_basic_user_file /etc/imagedb/htpasswd;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # content-addressed media -> cache forever (see src/lib/media.ts)
    location /media/ {
        alias /data/web/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        access_log off;
    }

    # container healthcheck + deploy scripts (no auth, internal only)
    location = /api/health {
        proxy_pass http://app:3000/api/health;
        access_log off;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

